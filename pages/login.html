<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - BDFAST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            margin: 0 auto;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header h2 {
            margin-bottom: 10px;
            font-weight: 700;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .login-form {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: block;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .form-check {
            margin-bottom: 15px;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
        }
        .admin-login {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        .admin-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-sign-in-alt"></i>
            <h2>BDFAST লগইন</h2>
            <p class="mb-0">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
        </div>

        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginMobile">
                        <i class="fas fa-phone"></i> মোবাইল নম্বর বা ইমেইল
                    </label>
                    <input type="text" id="loginMobile" class="form-control" placeholder="০১X XXXX XXXX বা ইমেইল" required>
                    <div class="error-message" id="loginMobileError"></div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> পাসওয়ার্ড
                    </label>
                    <div class="input-group">
                        <input type="password" id="loginPassword" class="form-control" placeholder="আপনার পাসওয়ার্ড" required>
                        <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="rememberMe" class="form-check-input">
                    <label class="form-check-label" for="rememberMe">
                        আমাকে মনে রাখুন
                    </label>
                </div>

                <div class="forgot-password">
                    <a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> লগইন করুন
                </button>
            </form>

            <div class="admin-login">
                <small>অ্যাডমিন প্যানেলে প্রবেশ করতে চান?</small><br>
                <a href="admin/login.html">অ্যাডমিন লগইন</a>
            </div>

            <div class="register-link">
                অ্যাকাউন্ট নেই? <a href="register.html">এখানে নিবন্ধন করুন</a>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle Password Visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('loginPassword');
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Handle Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            await handleLogin();
        });

        async function handleLogin() {
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Clear previous errors
            document.getElementById('loginMobileError').textContent = '';
            document.getElementById('loginPasswordError').textContent = '';

            // Validation
            if (!mobile) {
                document.getElementById('loginMobileError').textContent = 'মোবাইল নম্বর বা ইমেইল প্রয়োজন';
                return;
            }

            if (!password) {
                document.getElementById('loginPasswordError').textContent = 'পাসওয়ার্ড প্রয়োজন';
                return;
            }

            const button = document.querySelector('.btn-login');
            BDFAST.setLoadingState(button, true);

            try {
                const response = await BDFAST.apiCall('/auth/login', 'POST', {
                    identifier: mobile,
                    password: password
                });

                if (response && response.success) {
                    // Store token and user info
                    localStorage.setItem('token', response.token);
                    BDFAST.setUserInfo(response.user);

                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    }

                    BDFAST.showAlert('লগইন সফল! আপনি পুনর্নির্দেশিত হবেন...', 'success');
                    
                    // Redirect based on user role
                    setTimeout(() => {
                        if (response.user.role === 'admin' || response.user.role === 'officer') {
                            window.location.href = 'admin/dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    BDFAST.showAlert(response?.message || 'লগইন ব্যর্থ হয়েছে', 'danger');
                }
            } catch (error) {
                console.error('Login Error:', error);
                BDFAST.showAlert('একটি ত্রুটি ঘটেছে। দয়া করে পুনরায় চেষ্টা করুন', 'danger');
            } finally {
                BDFAST.setLoadingState(button, false);
            }
        }
    </script>
</body>
</html>
